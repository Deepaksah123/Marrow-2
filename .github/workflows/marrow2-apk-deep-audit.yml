name: Marrow-2 APK Deep Audit

on:
  push:
    paths:
      - "base.part1.apk.zip"
      - "base.part2.apk.zip"
      - "base.part3.apk.zip"
      - ".github/workflows/marrow2-apk-deep-audit.yml"
      - "audit_trigger.txt"
  workflow_dispatch:

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract split APK parts and audit combined APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/apks

          for z in base.part1.apk.zip base.part2.apk.zip base.part3.apk.zip; do
            unzip -q -o "$z" -d audit/apks
          done

          {
            echo "MARROW-2 COMBINED SPLIT-APK DEEP AUDIT"
            echo "commit=$GITHUB_SHA"
            echo
            echo "[RAW PARTS]"
            for p in audit/apks/base.part*.apk; do
              echo "--- $p ---"
              stat -c "bytes=%s" "$p"
              sha256sum "$p"
              file "$p" || true
              xxd -l 32 "$p" || true
            done
            echo
            echo "[CONCATENATION]"
            cat audit/apks/base.part1.apk audit/apks/base.part2.apk audit/apks/base.part3.apk > audit/base_combined.apk
            stat -c "combined_bytes=%s" audit/base_combined.apk
            sha256sum audit/base_combined.apk
            file audit/base_combined.apk || true
            xxd -l 32 audit/base_combined.apk || true
            echo
            echo "[COMBINED ZIP TEST]"
            unzip -t audit/base_combined.apk 2>&1 | tail -n 20 || true
            echo
            echo "[COMBINED ZIPINFO]"
            zipinfo -v audit/base_combined.apk 2>&1 | head -n 120 || true
            echo
            echo "[ENTRY COUNT]"
            unzip -Z1 audit/base_combined.apk | wc -l || true
            echo
            echo "[DEX]"
            unzip -Z1 audit/base_combined.apk | grep -E '(^|/)classes([0-9]+)?\\.dex$' || true
            echo
            echo "[MANIFEST / RES / ASSETS / LIB / META-INF]"
            unzip -Z1 audit/base_combined.apk | grep -E '^(AndroidManifest\\.xml|resources\\.arsc|res/|assets/|lib/|META-INF/)' | head -n 2000 || true
            echo
            echo "[EXTENSION COUNTS]"
            unzip -Z1 audit/base_combined.apk | awk '
              {
                n=$0; sub(/^.*\\//,"",n)
                if (n !~ /\\./) ext="[no_ext]"
                else { sub(/^.*\\./,"",n); ext="." tolower(n) }
                c[ext]++
              }
              END {for (e in c) print c[e], e}
            ' | sort -nr || true
            echo
            echo "[AAPT BADGING]"
            AAPT=$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name aapt 2>/dev/null | head -n 1 || true)
            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging audit/base_combined.apk 2>&1 | head -n 200 || true
            else
              echo "aapt not found"
            fi
            echo
            echo "[APKSIGNER]"
            APKSIGNER=$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name apksigner 2>/dev/null | head -n 1 || true)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --verbose audit/base_combined.apk 2>&1 | head -n 200 || true
            else
              echo "apksigner not found"
            fi
          } > audit/apk_deep_audit.txt

          unzip -Z1 audit/base_combined.apk > audit/combined_entries.txt || true

      - name: Upload deep audit
        uses: actions/upload-artifact@v4
        with:
          name: marrow2-apk-deep-audit
          path: audit/
          if-no-files-found: error

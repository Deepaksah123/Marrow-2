name: Marrow-2 APK Deep Audit

on:
  workflow_dispatch:

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract and audit APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/apks
          for z in base.part1.apk.zip base.part2.apk.zip base.part3.apk.zip; do
            unzip -q -o "$z" -d audit/apks
          done

          {
            echo "MARROW-2 APK DEEP AUDIT"
            echo "commit=$GITHUB_SHA"
            echo

            for apk in audit/apks/base.part*.apk; do
              echo "============================================================"
              echo "APK: $apk"
              echo "------------------------------------------------------------"
              sha256sum "$apk"
              stat -c 'bytes=%s' "$apk"
              echo
              echo "[ZIP/APK TEST]"
              unzip -t "$apk" | tail -n 3
              echo
              echo "[TOP-LEVEL / COMPLETE ENTRY COUNT]"
              unzip -Z1 "$apk" | wc -l
              echo
              echo "[DEX]"
              unzip -Z1 "$apk" | grep -E '(^|/)classes([0-9]+)?\\.dex$' || true
              echo
              echo "[LIBRARIES]"
              unzip -Z1 "$apk" | grep -E '^lib/' || true
              echo
              echo "[ASSETS]"
              unzip -Z1 "$apk" | grep -E '^assets/' | head -n 500 || true
              echo
              echo "[RES]"
              unzip -Z1 "$apk" | grep -E '^res/' | head -n 500 || true
              echo
              echo "[META-INF]"
              unzip -Z1 "$apk" | grep -E '^META-INF/' | head -n 200 || true
              echo
              echo "[CONTENT EXTENSION COUNTS]"
              unzip -Z1 "$apk" | awk '
                BEGIN {IGNORECASE=1}
                {
                  n=$0
                  sub(/^.*\\//,"",n)
                  if (n !~ /\\./) ext="[no_ext]"
                  else { sub(/^.*\\./,"",n); ext="." tolower(n) }
                  c[ext]++
                }
                END {for (e in c) print c[e], e}
              ' | sort -nr
              echo
              echo "[AAPT BADGING]"
              AAPT=$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name aapt -o -name aapt2 2>/dev/null | head -n 1 || true)
              if [ -n "$AAPT" ]; then
                "$AAPT" dump badging "$apk" 2>&1 | head -n 120 || true
              else
                echo "aapt/aapt2 not found"
              fi
              echo
              echo "[APKSIGNER]"
              APKSIGNER=$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name apksigner 2>/dev/null | head -n 1 || true)
              if [ -n "$APKSIGNER" ]; then
                "$APKSIGNER" verify --verbose "$apk" 2>&1 | head -n 120 || true
              else
                echo "apksigner not found"
              fi
              echo
            done

            echo "============================================================"
            echo "CROSS-APK UNIQUE ENTRY NAMES"
            for apk in audit/apks/base.part*.apk; do
              unzip -Z1 "$apk"
            done | sort -u | head -n 20000
          } > audit/apk_deep_audit.txt

          # Also save per-APK entry lists for exact downstream inspection.
          for apk in audit/apks/base.part*.apk; do
            b=$(basename "$apk" .apk)
            unzip -Z1 "$apk" > "audit/${b}_entries.txt"
          done

      - name: Upload deep audit
        uses: actions/upload-artifact@v4
        with:
          name: marrow2-apk-deep-audit
          path: audit/
          if-no-files-found: error
